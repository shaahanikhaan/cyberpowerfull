language: english
output_format: json

# English: Recon configuration
# Roman Urdu: Recon configuration (Recon configuration)
recon:
  nmap_args: '-sV -sC -T4'
  rustscan_args: '--quick'
  subdomain_depth: 3
  waf_bypass_enabled: true
  ai_agent_integration: true
  kali20263_automation: true  # Gap 6 - Kali 2026.3 tools automation
  nuclei_nikto_integration: true  # Gap 11 - Nuclei & Nikto automation (No API key, No Docker)
  sn1per_strix_integration: true  # Gap 12 - Sn1per & Strix integration (No API key, No Docker)

# English: Scanner configuration (NEW - Recon first, then POWERFULL discovery + AI integration)
# Roman Urdu: Scanner configuration (NEW - Recon pehle, phir POWERFULL discovery + AI integration) (Scanner configuration (NEW - Recon pehle, phir POWERFULL discovery + AI integration))
scanner:
  cve_only: false  # English: Not limited to known CVEs | Roman Urdu: Sirf pehle se maloom CVEs se aage (Sirf pehle se maloom CVEs se aage)
  deep_research: true  # English: 2026 AI-driven CVE discovery research | Roman Urdu: 2026 AI-driven CVE discovery research (2026 AI-driven CVE discovery research)
  powerfull_tools: true  # English: POWERFULL new vulnerability discovery tools | Roman Urdu: POWERFULL nayi vulnerability discovery tools (POWERFULL nayi vulnerability discovery tools)
  recon_first: true  # English: Recon phase first, then scanner | Roman Urdu: Recon phase pehle, phir scanner (Recon phase pehle, phir scanner)
  aidriven_integration: true  # Gap 7 - 2026 AI-Driven CVE Integration

# English: 10-Hour Powerfull Phase Design (Extended to 12 Gaps) - 10* POWERFULL
# Roman Urdu: 10-Hour Powerfull Phase Design (12 Gaps tak extended) - 10* POWERFULL (10-Hour Powerfull Phase Design (12 Gaps tak extended) - 10* POWERFULL)
powerfull_phase:
  duration_per_phase: 2  # Hours per phase
  total_phases: 5
  phase1_research: true
  phase2_integration: true
  phase3_custom_gaps: true  # Now includes Gap 6, 7, 8, 9, 10, 11, 12
  phase4_execution: true
  phase5_reporting: true

# English: Language support
# Roman Urdu: Language support (Language support)
language_support:
  english: true
  roman_urdu: true

# English: WAF Bypass configuration
# Roman Urdu: WAF Bypass configuration (WAF Bypass configuration)
waf_bypass:
  enabled: true
  origin_ip_hunt: true
  transport_bypass: true
  parsing_fuzz: true
  nmap_evasion: true

# English: AI Agent integration
# Roman Urdu: AI Agent integration (AI Agent integration)
ai_agents:
  enabled: true
  agents:
    - pentagi
    - pentestgpt
    - rapidpen
    - breachseek
    - deepexploit
    - crla
    - mddqn
    - shellgpt
    - kali_ai_security_toolkit

