[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberpowerfull"
version = "2.0.0"
description = "Local-only autonomous penetration-testing agent: model-backed reasoning, typed tool layer, deterministic memory."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "cyberpowerfull contributors" }]
keywords = ["security", "pentest", "llm", "agent", "llama.cpp", "ollama"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.6",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "black>=24",
  "pre-commit>=3.7",
]

[project.scripts]
cyberpowerfull = "cyberpowerfull.cli:main"

[project.urls]
Homepage = "https://github.com/shaahanikhaan/cyberpowerfull"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyberpowerfull = [
  "brain/*.jinja",
  "skills/packs/*.md.jinja",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=cyberpowerfull --cov-report=term-missing --cov-fail-under=70"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["cyberpowerfull"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py310"]
